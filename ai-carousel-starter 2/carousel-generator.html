<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nael's Carousel Generator</title><style>body{font:16px system-ui;background:#f3f5f8;color:#142033;max-width:1000px;margin:40px auto;padding:24px}textarea{width:100%;height:280px;box-sizing:border-box;font:14px monospace;padding:16px;border:1px solid #8796aa;border-radius:12px}button,a.download{display:inline-block;padding:14px 20px;background:#123f50;color:white;border:0;border-radius:8px;margin:8px 8px 8px 0;cursor:pointer;font:inherit}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}canvas{width:100%;height:auto;border-radius:10px}#status{min-height:28px}label{display:block;margin:16px 0 8px}a{color:#123f50}</style><h1>Your AI carousel generator</h1><p>Paste a post's JSON, generate slides, then download each image. Everything stays in this browser. No API key or subscription.</p><label for="input">Post JSON (caption and slides)</label><textarea id="input"></textarea><button id="generate">Generate slides</button><button id="caption">Copy caption</button><p id="status" role="status"></p><div id="gallery"></div><script>
const initial={"caption": "Five practical AI prompts for everyday tasks. Give the AI useful context, check the answer, and adapt it to your needs. Save these for later. #AI #AITips #Productivity", "slides": [{"number": 1, "title": "Give AI a better brief", "body": "Five practical prompts for everyday tasks. Replace vague requests with clear instructions you can actually use."}, {"number": 2, "title": "Turn a messy list into a plan", "body": "Prompt: Organise these tasks by deadline and importance. Suggest a realistic order and flag anything that needs more information. Tasks: [paste your list]."}, {"number": 3, "title": "Understand something unfamiliar", "body": "Prompt: Explain [topic] in plain English. Give one everyday example, then ask me three questions to check my understanding. Flag anything uncertain."}, {"number": 4, "title": "Make your writing clearer", "body": "Prompt: Edit this draft for clarity while keeping my tone. Do not add facts. Show the revised version and explain your three most useful changes. Draft: [paste]."}, {"number": 5, "title": "Compare your options", "body": "Prompt: Compare [option A] and [option B] against these criteria: [list]. Use only the information below. Mark missing details instead of guessing. Information: [paste]."}, {"number": 6, "title": "Practise a conversation", "body": "Prompt: Role-play [situation] with me. Ask one question at a time. After five exchanges, give specific feedback on how clearly I communicated."}, {"number": 7, "title": "Try one. Check the result.", "body": "Choose a prompt, add your context and refine the answer. Check important facts and leave private information out. Save this carousel for your next AI session."}]};
const input=document.getElementById('input'),status=document.getElementById('status'),gallery=document.getElementById('gallery');input.value=JSON.stringify(initial,null,2);
function lines(ctx,text,max){let a=[],s='';for(const w of text.split(/\s+/)){if(ctx.measureText(w).width>max)throw Error('A word is too long to fit.');let t=s?s+' '+w:w;if(ctx.measureText(t).width>max){a.push(s);s=w}else{s=t}}if(s)a.push(s);return a}
function render(){try{const p=JSON.parse(input.value);if(!Array.isArray(p.slides)||p.slides.length<2||p.slides.length>10)throw Error('Use 2–10 slides.');const frag=document.createDocumentFragment();p.slides.forEach((s,i)=>{if(typeof s.title!=='string'||typeof s.body!=='string')throw Error('Every slide needs a title and body.');const box=document.createElement('div'),c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#0c1422';x.fillRect(0,0,1080,1350);x.textBaseline='top';x.fillStyle='white';x.font='bold 28px Arial';x.fillText('NAEL BUILDING BIG',84,82);x.font='27px Arial';x.fillStyle='#79e2d0';x.fillText('AI TOOLS / PRACTICAL PROMPTS',84,126);x.fillStyle='#344153';x.fillRect(84,192,912,2);let y=270;x.fillStyle='#79e2d0';x.font='bold 65px Arial';for(const l of lines(x,s.title,900)){x.fillText(l,84,y);y+=80}y+=55;x.font='39px Arial';x.fillStyle='#f3f5fa';for(const l of lines(x,s.body,900)){x.fillText(l,84,y);y+=59}if(y>1150)throw Error('Slide '+(i+1)+' is too long. Shorten its text.');x.font='27px Arial';x.fillStyle='#c5cedb';x.fillText('@naelbuildingbig01',84,1230);x.fillText(String(i+1).padStart(2,'0')+' / '+String(p.slides.length).padStart(2,'0'),900,1230);const a=document.createElement('a');a.className='download';a.textContent='Download slide '+(i+1);a.download='slide-'+String(i+1).padStart(2,'0')+'.jpg';a.href=c.toDataURL('image/jpeg',.95);box.append(c,a);frag.append(box)});gallery.replaceChildren(frag);status.textContent='Ready: '+p.slides.length+' slides, 1080 × 1350 pixels.'}catch(e){gallery.replaceChildren();status.textContent=e.message}}
document.getElementById('generate').onclick=render;document.getElementById('caption').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.parse(input.value).caption||'');status.textContent='Caption copied.'}catch(e){status.textContent='Copy the caption from the JSON above.'}};render();</script></html>
