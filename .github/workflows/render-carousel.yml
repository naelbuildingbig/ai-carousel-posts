name: Render and publish carousel
on:
  repository_dispatch:
    types: [carousel-ready]
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Unique post date (YYYY-MM-DD)'
        required: true
        type: string
      post_json:
        description: 'JSON containing caption and slides'
        required: true
        type: string
      publish:
        description: 'Send completed images to Make for publishing'
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: carousel-delivery
  cancel-in-progress: false
jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer
        working-directory: automation
        run: npm ci && npx playwright install chromium
      - name: Validate renderer
        working-directory: automation
        run: npm run validate
      - name: Render slides with the approved template
        run: node automation/render.mjs
      - name: Save rendered slides
        run: |
          git config user.name 'carousel-bot'
          git config user.email 'carousel-bot@users.noreply.github.com'
          git add posts/
          git diff --cached --quiet || git commit -m 'Render carousel slides'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish through Make
        if: github.event_name == 'repository_dispatch' || inputs.publish
        env:
          MAKE_PUBLISH_WEBHOOK: ${{ secrets.MAKE_PUBLISH_WEBHOOK }}
        run: node automation/deliver.mjs
